[package]
name          = "lux-aurumque"
version       = "0.3.0"
description   = "A transient path tracer in Rust: light propagating at finite speed, rendered frame by picosecond."
keywords      = ["graphics", "rendering", "path-tracing", "transient", "physics"]
categories    = ["graphics", "rendering", "science"]
readme        = "README.md"
homepage      = "https://github.com/willt08/lux-aurumque"
documentation = "https://docs.rs/lux-aurumque"
exclude       = ["frames/", "*.mp4", "preview.gif"]

edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[dependencies]
glam            = "0.27"
rayon           = "1.10"
image           = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rand            = "0.8"
rand_xoshiro    = "0.6"
spectral-budget = { version = "0.1", path = "../spectral-budget" }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
