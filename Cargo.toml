[workspace]
resolver = "2"
members = [
    "crates/spectral-budget",
    "crates/lux-vision",
    "crates/lux-aurumque",
]

[workspace.package]
edition      = "2024"
rust-version = "1.88"
authors      = ["3BSN LLC"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/willt08/lux-aurumque"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
