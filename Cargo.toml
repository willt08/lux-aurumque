[package]
name          = "lux-aurumque"
version       = "0.2.0"
edition       = "2024"
rust-version  = "1.85"
authors       = ["3BSN LLC"]
description   = "A minimal transient path tracer: light propagating with finite speed, rendered frame-by-picosecond."
license       = "MIT OR Apache-2.0"
readme        = "README.md"
repository    = "https://github.com/willt08/lux-aurumque"
homepage      = "https://github.com/willt08/lux-aurumque"
keywords      = ["graphics", "rendering", "path-tracing", "transient", "physics"]
categories    = ["graphics", "rendering", "science"]
exclude       = ["frames/", "*.mp4", "preview.gif"]

[dependencies]
glam   = "0.27"   # SIMD-friendly 3D vector math
rayon  = "1.10"   # data-parallel pixel rendering
image  = { version = "0.25", default-features = false, features = ["png"] }
rand   = "0.8"
rand_xoshiro = "0.6"  # fast, deterministic per-thread RNG

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
